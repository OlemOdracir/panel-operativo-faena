name: panel-operativo-faena

services:
  database:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env and configure POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env and configure POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  database-migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: 'no'
    user: node
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?schema=public
    command: ['./node_modules/.bin/prisma', 'migrate', 'deploy', '--config', 'prisma.config.ts']
    depends_on:
      database:
        condition: service_healthy

  database-seed:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: 'no'
    user: node
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?schema=public
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Configure SEED_ADMIN_PASSWORD in .env}
      SEED_SUPERVISOR_PASSWORD: ${SEED_SUPERVISOR_PASSWORD:?Configure SEED_SUPERVISOR_PASSWORD in .env}
    command: ['./node_modules/.bin/tsx', 'prisma/seed.ts']
    depends_on:
      database-migrate:
        condition: service_completed_successfully

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET in .env}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on:
      database:
        condition: service_healthy
      database-seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api/v1}
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--spider', 'http://127.0.0.1:8080/healthz']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  reading-generator:
    profiles: ['live']
    build:
      context: ./tools/reading-generator
    restart: unless-stopped
    environment:
      FAENA_API_URL: http://api:3000/api/v1
      FAENA_ADMIN_EMAIL: ${FAENA_ADMIN_EMAIL:-admin@faena.local}
      FAENA_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Configure SEED_ADMIN_PASSWORD in .env}
      GENERATOR_INTERVAL_SECONDS: ${GENERATOR_INTERVAL_SECONDS:-10}
      GENERATOR_BATCH_SIZE: ${GENERATOR_BATCH_SIZE:-1}
      GENERATOR_OUTLIER_RATIO: ${GENERATOR_OUTLIER_RATIO:-0.2}
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
